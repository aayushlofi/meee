<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>aayush. — archive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Film Grain -->
    <div class="grain"></div>

    <!-- =========================
         SECTION 01 — LANDING
    ========================== -->
    <main id="home" class="landing section">

        <div class="landing-content">

            <div class="profile-placeholder">
                <span>01</span>
            </div>

            <h1>aayush.</h1>

            <p class="mono subtitle">
                espresso &amp; tailoring
            </p>

            <button
                class="archive-btn"
                id="enterArchive"
                type="button"
            >
                <span>enter archive</span>
                <span class="arrow">↓</span>
            </button>

        </div>

    </main>


    <!-- =========================
         SECTION 02 — ABOUT
    ========================== -->
    <section id="about" class="about section">

        <div class="about-image image-placeholder">

            <img
                src="coffee.jpg"
                alt="Coffee"
                loading="lazy"
            >

            <div class="image-label">
                IMG_00
            </div>

        </div>

        <div class="about-content">

            <div class="about-header">
                <span class="section-number">00:00</span>
            </div>

            <div class="about-text">

                <p>
                    Born at the midnight hour. VIII.X.
                    Navigating the quiet spaces between
                    late-night dark roasts, structured garments,
                    and cinematic shadows. This is a digital
                    canvas for the unbothered.
                </p>

            </div>

            <div class="about-footer">
                <em>fursat.</em>
            </div>

        </div>

    </section>


    <!-- =========================
         SECTION 03 — ARCHIVE
    ========================== -->
    <section id="archive" class="archive section">

        <div class="archive-heading">

            <span class="section-number">ARCHIVE</span>

            <span class="archive-count">
                04 / 04
            </span>

        </div>


        <div class="archive-grid">

            <figure class="archive-item">

                <img
                    src="faceless_mirror.jpg"
                    alt="Faceless mirror"
                    loading="lazy"
                >

                <figcaption>
                    <span>01</span>
                    faceless mirror
                </figcaption>

            </figure>


            <figure class="archive-item">

                <img
                    src="overcoat_drape.jpg"
                    alt="Overcoat drape"
                    loading="lazy"
                >

                <figcaption>
                    <span>02</span>
                    overcoat drape
                </figcaption>

            </figure>


            <figure class="archive-item">

                <img
                    src="street_shadow.jpg"
                    alt="Street shadow"
                    loading="lazy"
                >

                <figcaption>
                    <span>03</span>
                    street shadow
                </figcaption>

            </figure>


            <figure class="archive-item">

                <img
                    src="midnight_cafe.jpg"
                    alt="Midnight cafe"
                    loading="lazy"
                >

                <figcaption>
                    <span>04</span>
                    midnight cafe
                </figcaption>

            </figure>

        </div>

    </section>


    <!-- =========================
         SECTION 04 — DEDICATION
    ========================== -->
    <section id="dedication" class="dedication section">

        <div class="dedication-content">

            <p class="dedication-title">
                X.III ∞ VIII.X
            </p>

            <div class="audio-wrapper">

                <audio
                    id="audioPlayer"
                    controls
                    preload="metadata"
                >
                    <source src="audio.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>

            </div>

            <p class="dedication-subtext">
                waiting on sukoon.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
